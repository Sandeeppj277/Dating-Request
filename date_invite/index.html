<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question for you...</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="ask-page">
    <!-- Video added. Please download from Pexels and save as heart_video.mp4 -->
    <img
      width="300"
      class="heart"
      src="https://images.pexels.com/photos/5713548/pexels-photo-5713548.jpeg"
      alt="Your browser does not support the video tag."
    />

    <h1>Will you go on a date with me? 🥺</h1>

    <div class="buttons">
      <button id="yesBtn" onclick="window.location.href = 'yes.html'">
        Yes
      </button>
      <button id="noBtn" onclick="handleNo()">No</button>
    </div>

    <script>
      const noTexts = [
        "Are you sure?",
        "Really sure?",
        "Think again!",
        "Last chance!",
        "Surely not?",
        "You might regret this!",
        "Have a heart!",
        "Don't be so cold!",
        "Change of heart?",
        "Wouldn't you reconsider?",
      ];

      let noCount = 0;
      let yesSize = 1.5; // Starting font size in em

      function handleNo() {
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");

        // Change No button text and make Yes button bigger
        if (noCount < noTexts.length) {
          noBtn.innerText = noTexts[noCount];
          noCount++;

          // Grow the yes button
          yesSize += 0.6;
          yesBtn.style.fontSize = yesSize + "em";
          yesBtn.style.padding = yesSize * 10 + "px " + yesSize * 20 + "px";
        } else {
          // If she clicked 'no' too many times, remove the button so only 'Yes' is left
          noBtn.style.display = "none";
        }
      }
    </script>
  </body>
</html>
